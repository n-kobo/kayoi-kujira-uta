name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 単一HTMLの成果物。Actionsの実行ページからダウンロードして配布できる
      - uses: actions/upload-artifact@v4
        with:
          name: kujira-uta-app
          path: dist/index.html
