<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", Georgia, serif;
    background: transparent;
    padding: 40px 20px;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
    max-width: 900px;
    margin: 0 auto;
  }

  .nav-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 6px 14px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(200, 221, 227, 0.8);
    border-radius: 4px;
    text-decoration: none;
    color: #1a4a5a;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s ease;
    min-height: 93px;
    box-shadow: 0 2px 12px rgba(44, 100, 120, 0.15);
  }

  .nav-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #2d7a8a, #4aa8be);
    transform: scaleX(0);
    transition: transform 0.3s ease;
    transform-origin: left;
  }

  .nav-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #2d7a8a 0%, #1a5568 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 0;
  }

  .nav-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 28px rgba(44, 100, 120, 0.35);
    border-color: #2d7a8a;
    background: rgba(255, 255, 255, 0.85);
  }

  .nav-card:hover::before {
    transform: scaleX(1);
  }

  .nav-card:hover::after {
    opacity: 1;
  }

  .nav-card:hover .card-icon,
  .nav-card:hover .card-title,
  .nav-card:hover .card-sub {
    color: #fff;
    position: relative;
    z-index: 1;
  }

  .card-icon {
    font-size: 1.6rem;
    margin-bottom: 6px;
    line-height: 1;
    position: relative;
    z-index: 1;
    transition: color 0.3s ease;
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.4;
    position: relative;
    z-index: 1;
    transition: color 0.3s ease;
    color: #1a4a5a;
  }

  .card-sub {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    margin-top: 4px;
    opacity: 0.7;
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    transition: color 0.3s ease;
    color: #4a7a8a;
  }

  /* 個別カラーアクセント（ホバー前の上部ライン） */
  .nav-card[data-color="topics"]   { --accent: #e07b3a; }
  .nav-card[data-color="search"]   { --accent: #3a7be0; }
  .nav-card[data-color="learn"]    { --accent: #3aae7a; }
  .nav-card[data-color="about"]    { --accent: #9b5de5; }
  .nav-card[data-color="history"]  { --accent: #d4a017; }
  .nav-card[data-color="video"]    { --accent: #e03a5a; }
  .nav-card[data-color="publish"]  { --accent: #2d7a8a; }
  .nav-card[data-color="usage"]    { --accent: #5a8a4a; }

  .nav-card[data-color="topics"]::before  { background: linear-gradient(90deg, #e07b3a, #f0a060); }
  .nav-card[data-color="search"]::before  { background: linear-gradient(90deg, #3a7be0, #60a0f0); }
  .nav-card[data-color="learn"]::before   { background: linear-gradient(90deg, #3aae7a, #60d8a0); }
  .nav-card[data-color="about"]::before   { background: linear-gradient(90deg, #9b5de5, #bb80ff); }
  .nav-card[data-color="history"]::before { background: linear-gradient(90deg, #d4a017, #f0c030); }
  .nav-card[data-color="video"]::before   { background: linear-gradient(90deg, #e03a5a, #f06080); }
  .nav-card[data-color="publish"]::before { background: linear-gradient(90deg, #2d7a8a, #4aa8be); }
  .nav-card[data-color="usage"]::before   { background: linear-gradient(90deg, #5a8a4a, #80b060); }

  @media (max-width: 640px) {
    .nav-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }
    .nav-card {
      padding: 12px 6px 10px;
      min-height: 80px;
    }
    .card-icon { font-size: 1.3rem; }
    .card-title { font-size: 0.82rem; }
  }
</style>
